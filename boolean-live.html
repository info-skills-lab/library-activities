<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live search builder | UNSW Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--yellow:#FFDC00;--teal:#007882;--panel:#f5f5f3;--muted:#444;--line:#d9d9d9}
*{box-sizing:border-box}
body{margin:0;font-family:Lexend,system-ui,Arial,sans-serif;font-weight:300;color:var(--ink);background:#fff;min-height:100vh}
.side{position:fixed;right:0;top:0;bottom:0;width:72px;background:var(--yellow)}
main{padding:36px 120px 40px 56px;max-width:1500px}
:focus-visible{outline:4px solid #1a5fd1;outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.prog{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 22px;padding:0;list-style:none}
.prog button{font:inherit;font-size:20px;font-weight:700;border:3px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:6px 20px;cursor:pointer}
.prog button[aria-current="step"]{background:var(--yellow)}
.prog button.done{background:var(--ink);color:var(--yellow)}
.step{display:inline-block;background:var(--teal);color:#fff;font-weight:700;font-size:20px;border-radius:999px;padding:4px 18px;margin:0 0 10px}
h1{font-size:52px;margin:0 0 8px;font-weight:700;line-height:1.1}
.sub{font-size:24px;margin:0 0 26px;color:var(--muted)}
.panel{border:4px solid var(--ink);border-radius:20px;padding:26px 28px;background:#fff}
label.f{display:block;font-size:20px;font-weight:700;margin:0 0 8px}
textarea{width:100%;font:inherit;font-size:26px;border:3px solid var(--ink);border-radius:14px;padding:14px 18px;min-height:96px;resize:vertical}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{font:inherit;font-size:22px;font-weight:700;border:3px solid #000;background:var(--yellow);color:#000;border-radius:12px;padding:10px 22px;cursor:pointer}
.btn.ghost{background:#fff}
.btn.dark{background:var(--ink);color:var(--yellow);border-color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:default}
.hint{font-size:18px;color:var(--muted);margin:10px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px;min-height:56px;list-style:none;padding:0}
.chip{display:inline-flex;align-items:center;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.chip .w{font:inherit;font-size:24px;font-weight:700;border:0;background:transparent;color:var(--ink);padding:8px 8px 8px 20px;cursor:pointer}
.chip.tr{background:var(--yellow)}
.chip .x{font:inherit;font-size:22px;border:0;border-left:2px solid var(--ink);background:transparent;color:var(--ink);padding:8px 14px;cursor:pointer}
.chip .x:hover,.chip .w:hover{background:rgba(0,0,0,.08)}
.out{margin-top:26px;border:3px solid var(--ink);border-radius:16px;background:var(--panel);padding:18px 24px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:24px;line-height:1.55;word-break:break-word}
.out .l{display:block;font-family:Lexend,system-ui,sans-serif;font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.and{background:var(--yellow);border:2px solid #000;border-radius:8px;padding:0 8px;font-weight:700}
.nav{display:flex;justify-content:space-between;margin-top:28px}
.lbl{width:100%;font:inherit;font-size:26px;font-weight:700;border:0;border-bottom:3px dashed var(--line);padding:2px 0;margin:0 0 16px}
.empty{font-size:20px;color:var(--muted)}
@media (max-width:900px){main{padding:24px 90px 24px 20px}h1{font-size:36px}}
</style>
</head>
<body>
<div class="side" aria-hidden="true"></div>
<main>
<ol class="prog" id="prog" aria-label="Steps"></ol>
<div id="screen"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='boolean-live-v1';
let D={step:0,dials:[{n:'Trust',w:[]},{n:'AI tool',w:[]},{n:'Consumers',w:[]}]};
try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&v.dials)D=v}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
// a word is {t:'perceived risk', star:false}
const stem=t=>{if(/\s/.test(t))return t;const l=t.toLowerCase();for(const [suf,cut] of [['ility',5],['able',2],['ible',2],['ness',4],['ment',4],['ing',3],['ed',2],['s',1]]){if(l.endsWith(suf)&&t.length-cut>=4)return t.slice(0,t.length-cut)}return t};
const fmt=w=>{const t=w.star?stem(w.t)+'*':w.t;return /\s/.test(w.t)?'"'+t+'"':t};
const group=d=>!d.w.length?'':d.w.length>1?'('+d.w.map(fmt).join(' OR ')+')':fmt(d.w[0]);
const query=()=>D.dials.map(group).filter(Boolean).join(' AND ');
const queryHtml=(upto)=>{const g=D.dials.slice(0,upto).map(group).filter(Boolean);return g.length?g.map((x,i)=>(i?'<span class="and">AND</span> ':'')+esc(x)).join('<br>'):'<span style="font-family:Lexend,sans-serif;font-size:20px">Your search will appear here.</span>'};
function addWords(k,text){const d=D.dials[k];
 text.split(/[\n,;]+/).map(s=>s.replace(/["()*]/g,'').replace(/\s+/g,' ').trim()).filter(Boolean).forEach(t=>{
  if(!d.w.some(x=>x.t.toLowerCase()===t.toLowerCase()))d.w.push({t,star:false})});save()}
function prog(){const steps=[...D.dials.map((d,i)=>(i+1)+' '+d.n),'Run'];
 $('#prog').innerHTML=steps.map((s,i)=>`<li><button type="button" data-go="${i}" ${i===D.step?'aria-current="step"':''} class="${i<D.step?'done':''}">${i<D.step?'✓ ':''}${esc(s)}</button></li>`).join('')}
function render(focusSel){prog();const k=D.step,sc=$('#screen');
 if(k<D.dials.length){const d=D.dials[k];
  sc.innerHTML=`<span class="step">Concept ${k+1} of ${D.dials.length}</span>
  <h1>Words for <span id="cname">${esc(d.n.toLowerCase())}</span></h1>
  <p class="sub">Add the best words from the word cloud. Tap a word to add or remove an asterisk.</p>
  <div class="panel"><label class="sr" for="lbl">Concept name</label><input class="lbl" id="lbl" value="${esc(d.n)}" autocomplete="off">
   <label class="f" for="win">Type or paste words, separated by commas or new lines</label>
   <textarea id="win" placeholder="e.g. trust, confidence, perceived risk"></textarea>
   <div class="row"><button class="btn" type="button" id="add">Add words</button><button class="btn ghost" type="button" id="clr" ${d.w.length?'':'disabled'}>Clear this concept</button></div>
   <ul class="chips" id="chips" aria-label="Words for ${esc(d.n)}">${d.w.length?d.w.map((w,i)=>`<li class="chip ${w.star?'tr':''}"><button class="w" type="button" data-i="${i}" aria-pressed="${w.star}" aria-label="${esc(fmt(w))}. Select to ${w.star?'remove':'add'} truncation">${esc(fmt(w))}</button><button class="x" type="button" data-x="${i}" aria-label="Remove ${esc(w.t)}">×</button></li>`).join(''):'<li class="empty">No words yet.</li>'}</ul>
  </div>
  <div class="out" aria-live="polite"><span class="l">Class search so far</span>${queryHtml(k+1)}</div>
  <div class="nav"><button class="btn ghost" type="button" id="back" ${k?'':'disabled'}>← Back</button><button class="btn" type="button" id="next">Next →</button></div>`;
  const win=$('#win');
  $('#add').onclick=()=>{if(!win.value.trim())return;addWords(k,win.value);render('#win')};
  win.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#add').click()}});
  $('#clr').onclick=()=>{d.w=[];save();render('#win')};
  $('#lbl').addEventListener('input',e=>{d.n=e.target.value.trim()||'Concept';$('#cname').textContent=d.n.toLowerCase();save();prog()});
  $('#chips').onclick=e=>{const w=e.target.closest('.w'),x=e.target.closest('.x');
   if(w){const i=+w.dataset.i;d.w[i].star=!d.w[i].star;save();render(`.w[data-i="${i}"]`)}
   if(x){d.w.splice(+x.dataset.x,1);save();render('#win')}};
 }else{
  sc.innerHTML=`<span class="step">Run it</span><h1>Search Business Source Premier</h1>
  <p class="sub">The class’s finished search, ready to run live.</p>
  <div class="out" style="font-size:28px"><span class="l">Class search</span>${queryHtml(D.dials.length)}</div>
  <div class="row" style="margin-top:26px"><button class="btn dark" type="button" id="run" ${query()?'':'disabled'}>Open in Business Source Premier ↗<span class="sr"> (opens in a new window)</span></button><button class="btn ghost" type="button" id="cp" ${query()?'':'disabled'}>Copy search</button></div>
  <p class="hint" id="cpm" aria-live="polite"></p>
  <div class="nav"><button class="btn ghost" type="button" id="back">← Back</button><button class="btn ghost" type="button" id="reset">Start again</button></div>`;
  $('#run').onclick=()=>window.open('https://research.ebsco.com/c/cqb6z7/search/results?autocorrect=y&db=buh&expanders=concept&limiters=None&searchMode=enhanced&q='+encodeURIComponent(query()).replace(/%20/g,'+'),'_blank','noopener');
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(query());$('#cpm').textContent='Copied.'}catch(e){$('#cpm').textContent='Select the search above and copy it manually.'}};
  $('#reset').onclick=()=>{D={step:0,dials:D.dials.map(d=>({n:d.n,w:[]}))};save();render('#win')};
 }
 const b=$('#back');if(b)b.onclick=()=>{D.step--;save();render('h1')};
 const n=$('#next');if(n)n.onclick=()=>{D.step++;save();render('h1')};
 if(focusSel){const f=document.querySelector(focusSel);if(f){if(f.tagName==='H1')f.setAttribute('tabindex','-1');f.focus()}}}
$('#prog').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){D.step=+b.dataset.go;save();render('h1')}});
render();
</script>
</body>
</html>
